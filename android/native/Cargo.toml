[package]
name = "mirelay-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mirelay_android"
crate-type = ["cdylib"]

[dependencies]
mirelay = { path = "../..", default-features = false }
jni = "=0.21.1"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "=0.7.0"
jni22 = { package = "jni", version = "=0.22.4", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
